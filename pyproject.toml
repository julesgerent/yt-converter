[project]
name = "yt-converter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet>=1.1.3",
    "imageio-ffmpeg>=0.8.1",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
yt-converter = "yt_converter:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"